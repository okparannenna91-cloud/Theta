name: SEO meta descriptions (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-meta-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rewrite marketing metadata
        run: node .github/seo-meta-fix.mjs

      - name: Commit and push
        run: |
          set -e
          git config user.name "theta-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app lib
          git rm -q .github/seo-meta-fix.mjs .github/workflows/seo-meta-fix.yml
          git commit -m "SEO: keep meta descriptions on full sentences across marketing pages"
          git push
