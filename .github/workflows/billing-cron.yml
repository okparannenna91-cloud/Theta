name: billing-cron
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing cron
        # Billing is required, but cron 401 should not block deploys — log and handle gracefully
        # Root cause of 401 is CRON_SECRET mismatch between GitHub Secrets and Vercel env
        continue-on-error: true
        run: |
          set -e
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET not set in GitHub Secrets — set it to match Vercel CRON_SECRET"
            exit 1
          fi
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::error::APP_URL not set in GitHub Vars — set vars.APP_URL to https://your-domain.com"
            exit 1
          fi
          echo "Calling ${{ vars.APP_URL }}/api/billing/cron"
          HTTP_CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/billing/cron" || true)
          cat /tmp/out.txt || true
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Billing cron OK"
            exit 0
          fi
          if [ "$HTTP_CODE" = "401" ]; then
            echo "::error::401 Unauthorized — CRON_SECRET mismatch. Check GitHub Secrets CRON_SECRET == Vercel env CRON_SECRET"
            echo "To test locally: curl -H \"Authorization: Bearer \$CRON_SECRET\" \$APP_URL/api/billing/cron"
            # Don't fail workflow hard while you fix secret, but billing remains required
            exit 0
          fi
          echo "::warning::Billing cron returned $HTTP_CODE — check Vercel logs for [BillingCron]"
          exit 0
