services:
  api:
    # Pinned to the last stable numbered release (config v1.3.13).
    # Do NOT float to :latest — custom endpoint options (headers, addUser,
    # dropParams) drift between versions and silently break the bridge.
    image: ghcr.io/danny-avila/librechat:v0.8.7
    restart: always
    ports:
      - "3080:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - ./images:/app/client/public/images
    depends_on:
      - mongo

  mongo:
    image: mongo
    restart: always
    volumes:
      - data-mongo:/data/db
    command: mongod --noauth

volumes:
  data-mongo: