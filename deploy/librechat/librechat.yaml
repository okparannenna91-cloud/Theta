# LibreChat configuration — Flow³ uses LibreChat ONLY as a chat UI shell.
# Every request goes to Theta's OpenAI-compatible bridge (/api/flow/chat),
# which executes the LangGraph agent. LibreChat agents/MCP are NOT enabled.
#
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
# NOTE: verify key names against the pinned LibreChat version during the
# Phase 2 spike (custom endpoint options have changed between versions).
version: 1.3.4

cache: true

interface:
  modelSelect: false
  bookmarks: false
  sidePanel: false

endpoints:
  custom:
    - name: Flow3
      apiKey: ${FLOW_BRIDGE_SECRET}
      baseURL: https://thetapm.site/api/flow
      models:
        flow-3:
          supportsCompletion: false
          supportsVision: false
          supportsFunctionCalling: true
        flow-3-fast:
          supportsCompletion: false
          supportsVision: false
          supportsFunctionCalling: true
      modelDisplayLabel: "Flow3"
      addUser: true
      userMessage: true
      titleConvo: false
      includeTitle: false
      dropParams:
        - stop