# LibreChat configuration — Flow³ uses LibreChat ONLY as a chat UI shell.
# Every request goes to Theta's OpenAI-compatible bridge (/api/flow/chat),
# which executes the LangGraph agent. LibreChat agents/MCP are NOT enabled.
#
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
# Config version matches LibreChat v0.8.7 (pinned image in docker-compose.yml).
version: 1.3.13

cache: true

interface:
  modelSelect: false
  bookmarks: false
  sidePanel: false

endpoints:
  custom:
    - name: Flow3
      apiKey: ${FLOW_BRIDGE_SECRET}
      baseURL: https://thetapm.site/api/flow
      # Identity + conversation continuity via headers (supported since v0.8.x:
      # values resolve ${ENV}, {{LIBRECHAT_USER_*}} and {{LIBRECHAT_BODY_*}}).
      # addUser:true below is a fallback in case this version drops the header
      # placeholders; the bridge accepts either source.
      headers:
        X-Flow-User: '{{LIBRECHAT_USER_EMAIL}}'
        X-Flow-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      models:
        flow-3:
          supportsCompletion: false
          supportsVision: false
          supportsFunctionCalling: true
        flow-3-fast:
          supportsCompletion: false
          supportsVision: false
          supportsFunctionCalling: true
      modelDisplayLabel: "Flow3"
      addUser: true
      userMessage: true
      titleConvo: false
      includeTitle: false
      dropParams:
        - stop